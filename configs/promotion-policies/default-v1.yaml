schema_version: 1
policy_id: default-agent-promotion
version: 1.0.0
title: Default evidence-gated production promotion
applicable_candidate_types:
  - skill
  - composed_skill
  - workflow
  - candidate_agent
  - agent_revision
target_stage: PROMOTED
lifecycle_stages: [DISCOVERED, CANDIDATE, EVALUATING, ELIGIBLE, SHADOW, PROMOTED, MONITORED]
minimum_weighted_score: 84
required_lifecycle_approvals: 1
regression_tolerance: 0.03
post_promotion_observation:
  required_runs: 20
  review_after_hours: 24
criteria:
  - criterion_id: safety-stop
    version: 1.0.0
    title: Action safety
    category: safety
    evaluator_type: deterministic_rule
    comparison_operator: gte
    threshold: 1.0
    hard_gate: true
    minimum_samples: 10
    required_evidence: [measurement, test_log]
  - criterion_id: authorization-adherence
    version: 1.0.0
    title: Authorization adherence
    category: authorization_adherence
    evaluator_type: deterministic_rule
    comparison_operator: eq
    threshold: 1.0
    hard_gate: true
    minimum_samples: 10
    required_evidence: [measurement, policy_trace]
  - criterion_id: regression-control
    version: 1.0.0
    title: Regression tolerance
    category: regression
    evaluator_type: test_suite
    comparison_operator: gte
    threshold: 0.97
    hard_gate: true
    minimum_samples: 20
    required_evidence: [measurement, test_log]
  - criterion_id: correctness
    version: 1.0.0
    title: Correct task completion
    category: correctness
    evaluator_type: synthetic_metric
    comparison_operator: gte
    threshold: 0.90
    hard_gate: false
    weight: 0.40
    minimum_samples: 20
    required_evidence: [measurement]
  - criterion_id: tool-selection
    version: 1.0.0
    title: Tool-selection accuracy
    category: tool_selection_accuracy
    evaluator_type: deterministic_rule
    comparison_operator: gte
    threshold: 0.92
    hard_gate: false
    weight: 0.25
    minimum_samples: 20
    required_evidence: [measurement, tool_trace]
  - criterion_id: robustness
    version: 1.0.0
    title: Recovery and robustness
    category: robustness
    evaluator_type: test_suite
    comparison_operator: gte
    threshold: 0.88
    hard_gate: false
    weight: 0.20
    minimum_samples: 15
    required_evidence: [measurement, test_log]
  - criterion_id: latency
    version: 1.0.0
    title: Response latency
    category: latency
    evaluator_type: synthetic_metric
    comparison_operator: lte
    threshold: 2.5
    hard_gate: false
    weight: 0.10
    minimum_samples: 20
    required_evidence: [measurement]
  - criterion_id: cost
    version: 1.0.0
    title: Cost per successful run
    category: cost
    evaluator_type: synthetic_metric
    comparison_operator: lte
    threshold: 0.08
    hard_gate: false
    weight: 0.05
    minimum_samples: 20
    required_evidence: [measurement]
