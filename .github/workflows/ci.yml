name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  backend:
    name: Backend lint, types, tests, coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: promotion
          POSTGRES_PASSWORD: promotion
          POSTGRES_DB: promotion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promotion -d promotion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://promotion:promotion@localhost:5432/promotion
      TEST_DATABASE_URL: postgresql+psycopg://promotion:promotion@localhost:5432/promotion
      STARTUP_BOOTSTRAP: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.7
      - name: Install locked dependencies
        working-directory: services/api
        run: uv sync --frozen --group dev
      - name: Ruff
        working-directory: services/api
        run: uv run ruff check .
      - name: Mypy
        working-directory: services/api
        run: uv run mypy src
      - name: Pytest
        working-directory: services/api
        run: uv run pytest --cov=promotion_control_plane --cov-report=term-missing --cov-fail-under=70

  migration-drift:
    name: SQLAlchemy and Alembic drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: promotion
          POSTGRES_PASSWORD: promotion
          POSTGRES_DB: promotion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promotion -d promotion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://promotion:promotion@localhost:5432/promotion
      STARTUP_BOOTSTRAP: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check uv==0.11.7
      - working-directory: services/api
        run: uv sync --frozen --group dev
      - name: Upgrade and verify the head
        working-directory: services/api
        run: |
          uv run alembic upgrade head
          uv run alembic current --check-heads
      - name: Reject model drift
        working-directory: services/api
        run: |
          output="$(uv run alembic check 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F "No new upgrade operations detected."

  frontend:
    name: Frontend lint, types, components, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Report all advisories and fail high or critical
        run: npm audit --audit-level=high

  line-endings:
    name: LF shell portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate attributes and shell files
        shell: bash
        run: |
          grep -Fx '*.sh text eol=lf' .gitattributes
          failed=0
          while IFS= read -r -d '' file; do
            if LC_ALL=C grep -q $'\r' "$file"; then
              echo "Carriage return found: $file"
              failed=1
            fi
            bash -n "$file" || failed=1
          done < <(git ls-files -z '*.sh')
          test "$failed" -eq 0

  contract-drift:
    name: OpenAPI and generated frontend types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install --disable-pip-version-check uv==0.11.7
      - working-directory: services/api
        run: uv sync --frozen --group dev
      - run: npm ci
      - name: Regenerate contracts
        run: |
          cd services/api
          uv run python -m promotion_control_plane.cli.main openapi --output ../../openapi/openapi.json
          cd ../..
          npm run generate:types
      - name: Reject drift
        run: git diff --exit-code -- openapi/openapi.json apps/web/src/generated/api.ts

  compose-e2e:
    name: Compose, Playwright, and production SSE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
      PROMOTION_E2E_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require Docker Compose 2.20 or newer
        shell: bash
        run: |
          version="$(docker compose version --short | sed 's/^v//; s/-.*//')"
          printf 'Docker Compose %s\n' "$version"
          test "$(printf '%s\n' 2.20.0 "$version" | sort -V | head -n 1)" = 2.20.0
      - name: Start from an empty database
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify services and deterministic cycle
        shell: bash
        run: |
          docker compose ps
          expected="$(printf '%s\n' api db web worker)"
          running="$(docker compose ps --services --status running | sort)"
          test "$running" = "$expected"
          for service in api db web worker; do
            container_id="$(docker compose ps -q "$service")"
            test -n "$container_id"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy
          done
          curl --fail-with-body http://localhost:8000/healthz
          curl --fail-with-body http://localhost:8000/docs
          curl --fail-with-body http://localhost:3001
          test "$(curl --fail-with-body --silent http://localhost:8000/api/v1/candidates | jq -r '.total')" = 8
          test "$(curl --fail-with-body --silent http://localhost:8000/api/v1/schedules | jq -r '.total')" = 6
          docker compose exec -T api python -m promotion_control_plane.cli.main run-demo-cycle --idempotency-key ci-demo-cycle
      - name: Repeat the exact idempotent startup command
        run: docker compose up --build --wait --wait-timeout 180
      - name: Browser and streaming tests
        run: |
          npm run test:e2e
          npm run build
          npm run test:sse
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v

  docker-windows-checkout:
    name: Docker images from normalized checkout
    runs-on: ubuntu-latest
    needs: line-endings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose build

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openai-live:
    name: Optional live OpenAI smoke and copy certification
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_EVAL_MODEL: gpt-5-mini
    steps:
      - name: Record unavailable live certification
        if: env.OPENAI_API_KEY == ''
        run: echo "OPENAI_API_KEY is absent; live smoke and semantic certification are unavailable."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.OPENAI_API_KEY != ''
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: env.OPENAI_API_KEY != ''
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check uv==0.11.7
        if: env.OPENAI_API_KEY != ''
      - working-directory: services/api
        if: env.OPENAI_API_KEY != ''
        run: uv sync --frozen --group dev
      - name: Live evaluator smoke and semantic copy certification
        if: env.OPENAI_API_KEY != ''
        working-directory: services/api
        run: uv run pytest -m live_openai
