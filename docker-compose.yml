name: agent-promotion-control-plane

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-promotion_control_plane}
      POSTGRES_USER: ${POSTGRES_USER:-promotion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promotion}
    ports:
      - "5433:5432"
    volumes:
      - promotion-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://promotion:promotion@db:5432/promotion_control_plane
      STARTUP_BOOTSTRAP: ${STARTUP_BOOTSTRAP:-true}
      DEMO_MODE: ${DEMO_MODE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EVAL_MODEL: ${OPENAI_EVAL_MODEL:-gpt-5-mini}
      CORS_ORIGINS: http://localhost:3001
      CONFIG_ROOT: /app/configs
      DEMO_FIXTURE_ROOT: /app/demo
    volumes:
      - ./configs:/app/configs:ro
      - ./demo:/app/demo:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./services/api
    command: ["python", "-m", "promotion_control_plane.worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://promotion:promotion@db:5432/promotion_control_plane
      STARTUP_BOOTSTRAP: "false"
      DEMO_MODE: ${DEMO_MODE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EVAL_MODEL: ${OPENAI_EVAL_MODEL:-gpt-5-mini}
      WORKER_HEALTH_FILE: /tmp/promotion-worker-health
      CONFIG_ROOT: /app/configs
      DEMO_FIXTURE_ROOT: /app/demo
    volumes:
      - ./configs:/app/configs:ro
      - ./demo:/app/demo:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "promotion_control_plane.cli.main", "worker-health", "--path", "/tmp/promotion-worker-health", "--max-age-seconds", "30"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE: /api
      HOSTNAME: 0.0.0.0
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  promotion-db:
