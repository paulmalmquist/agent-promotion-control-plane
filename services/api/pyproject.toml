[project]
name = "agent-promotion-control-plane-api"
version = "0.1.0"
description = "Portable reference API for governed autonomous-agent promotion."
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.19.1",
  "croniter==6.0.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "openai==1.102.0",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "pyyaml==6.0.2",
  "sqlalchemy==2.0.43",
  "structlog==25.4.0",
  "typer==0.16.1",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
  "types-croniter>=6.2.4.20260711",
  "types-python-dateutil==2.9.0.20250822",
  "types-pyyaml>=6.0.12.20260815",
]

[project.scripts]
promotion-control-plane = "promotion_control_plane.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promotion_control_plane"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=promotion_control_plane --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "postgres: requires a PostgreSQL database",
  "live_openai: optional credentialed OpenAI certification",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["promotion_control_plane"]
plugins = ["pydantic.mypy"]
